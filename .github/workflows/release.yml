name: Publish Release Notes

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish release notes for (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Locate release notes
        id: notes
        run: |
          tag="${{ steps.tag.outputs.name }}"
          path="docs/releases/${tag}.md"
          if [[ ! -f "$path" ]]; then
            echo "::error::missing release notes at $path — run scripts/dev/bump-version.sh and push the tag, or add the page manually."
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build release body
        id: body
        run: |
          # The Releases API rejects a body over 125,000 characters with
          # HTTP 422 "body is too long". A release spanning many feature-change
          # notes overruns that easily (v0.3.0 rendered 753 notes / ~195 KB), so
          # the builder bounds the body on a line boundary and links the full
          # rendered page instead of failing the publish.
          python3 scripts/dev/build_release_body.py \
            --notes "${{ steps.notes.outputs.path }}" \
            --out release-body.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-body.md --title "$tag"
          else
            gh release create "$tag" --notes-file release-body.md --title "$tag"
          fi
